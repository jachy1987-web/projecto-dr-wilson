<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Paciente - Dr. Wilson</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("imagenes/fondo doctor wilson.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .btn-volver-atras {
            position: absolute; top: 25px; left: 25px;         
            padding: 10px 22px; border-radius: 20px; 
            background-color: #007bff; color: #ffffff;     
            font-size: 15px; font-weight: bold; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); text-decoration: none;
            transition: background-color 0.2s, transform 0.1s; z-index: 10;        
        }
        .btn-volver-atras:hover { background-color: #0056b3; transform: scale(1.05); }

        h2 {
            color: #0c4a6e; margin-top: 20px; margin-bottom: 30px;
            font-size: 28px; font-weight: bold; text-align: center; width: 100%;
        }

        .contenedor-busqueda {
            background: #ffffff; width: 100%; max-width: 800px; padding: 30px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f5; box-sizing: border-box;
        }

        .caja-buscar { display: flex; align-items: center; position: relative; margin-bottom: 25px; }
        .caja-buscar i { position: absolute; left: 15px; color: #94a3b8; font-size: 18px; }
        .input-buscar { width: 100%; padding: 14px 14px 14px 45px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .input-buscar:focus { border-color: #007bff; }

        .tabla-resultados { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tabla-resultados th, .tabla-resultados td { padding: 14px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tabla-resultados th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        .tabla-resultados tr:hover { background-color: #f8fafc; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .badge-activo { background-color: #d1fae5; color: #065f46; }
    </style>
</head>

<body>
    <button class="btn-volver-atras" id="btn-volver-menu">Atrás</button>

    <!-- LOGO CENTRADO -->
    <div style="text-align: center; margin-top: 20px; margin-bottom: 10px; width: 100%;">
        <img src="imagenes/drwilson.png" alt="Logo Doctor Wilson" style="max-width: 420px !important; width: 100% !important; height: auto !important; display: block; margin: 0 auto;">
    </div>

    <h2>🔍 Buscar Paciente</h2>

    <div class="contenedor-busqueda">
        <div class="caja-buscar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="input-buscar" id="txt-buscar" placeholder="Escribe el nombre de la mascota, dueño o documento...">
        </div>

        <table class="tabla-resultados">
            <thead>
                <tr>
                    <th>Mascota</th>
                    <th>Especie</th>
                    <th>Propietario</th>
                    <th>Contacto</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
        </table>
    </div>

    <script>
        document.getElementById('btn-volver-menu').addEventListener('click', function() {
            window.location.href = 'menu-pacientes.html';
        });

        function cargarPacientesBusqueda() {
            const tablaCuerpo = document.getElementById('tabla-cuerpo');
            let listaPacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
            tablaCuerpo.innerHTML = '';

            if (listaPacientes.length === 0) {
                tablaCuerpo.innerHTML = `
                    <tr>
                        <td>Toby (Demo)</td>
                        <td>Perro (Canino)</td>
                        <td>Carlos Mendoza</td>
                        <td>ID: 12345</td>
                        <td><span class="badge badge-activo">Activo</span></td>
                    </tr>
                `;
                return;
            }

            listaPacientes.forEach(paciente => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><b>${paciente.mascota}</b></td>
                    <td>${paciente.especie}</td>
                    <td>${paciente.propietario}</td>
                    <td>${paciente.contacto}</td>
                    <td><span class="badge badge-activo">${paciente.estado}</span></td>
                `;
                tablaCuerpo.appendChild(fila);
            });
        }

        document.addEventListener('DOMContentLoaded', cargarPacientesBusqueda);

        document.getElementById('txt-buscar').addEventListener('input', function(e) {
            let termino = e.target.value.toLowerCase();
            let filas = document.querySelectorAll('#tabla-cuerpo tr');
            filas.forEach(fila => {
                let textoFila = fila.textContent.toLowerCase();
                if(textoFila.includes(termino)) { fila.style.display = ''; } else { fila.style.display = 'none'; }
            });
        });
    </script>
</body>
</html>
