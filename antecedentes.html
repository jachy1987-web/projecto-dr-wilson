<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antecedentes Clínicos - Dr. Wilson</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("imagenes/fondo doctor wilson.png");
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .cabecera-estatica { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 750px; margin-bottom: 20px; }
        .btn-volver-atras { position: absolute; left: 5px; top: 10px; display: flex; flex-direction: column; align-items: center; text-decoration: none; cursor: pointer; }
        .btn-volver-atras .circulo-flecha { width: 38px; height: 38px; background-color: #007bff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .btn-volver-atras span { margin-top: 4px; font-size: 10px; color: #034870; font-weight: bold; }
        .logo-cabecera { max-width: 220px; }

        .contenedor-grande {
            width: 100%; max-width: 750px; background: white; border-radius: 25px; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 8px solid #557a2b; text-align: left; box-sizing: border-box;
        }
        .titulo { color: #1e3a8a; font-size: 22px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; text-transform: uppercase; }
        .subtitulo-bloque { color: #557a2b; font-size: 14px; font-weight: bold; margin-top: 10px; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px; text-transform: uppercase; }
        
        .grid-formulario { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input, .form-group textarea { padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        .col-completa { grid-column: span 2; }
        
        .btn-guardar { width: 100%; padding: 14px; background: #557a2b; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-guardar:hover { background: #3f5c1f; }

        /* Estilos de la tabla de registros guardados */
        .tabla-historial { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fafafa; border-radius: 8px; overflow: hidden; }
        .tabla-historial th { background-color: #1e3a8a; color: white; padding: 12px; font-size: 13px; text-align: left; }
        .tabla-historial td { padding: 12px; font-size: 13px; border-bottom: 1px solid #e2e8f0; color: #334155; vertical-align: top; }
        .tabla-historial tr:last-child td { border-bottom: none; }
        .sin-datos { text-align: center; padding: 20px; color: #94a3b8; font-style: italic; background: #f8fafc; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="cabecera-estatica"><a href="menu-historias.html" class="btn-volver-atras"><div class="circulo-flecha">←</div><span>VOLVER</span></a><img src="imagenes/drwilson.png" class="logo-cabecera"></div>
    
    <div class="contenedor-grande">
        <div class="titulo">🩺 Evaluación y Antecedentes Médicos</div>
        
        <!-- Formulario para agregar nueva consulta -->
        <form id="form-ant">
            <div class="subtitulo-bloque">Agregar Nuevo Control / Evolución Clínica</div>
            <div class="grid-formulario">
                <div class="form-group"><label>Peso Actual (Kg):</label><input type="text" id="an-peso" placeholder="Ej: 14.2" required></div>
                <div class="form-group"><label>Temperatura (°C):</label><input type="text" id="an-temp" placeholder="Ej: 38.5" required></div>
                <div class="form-group col-completa"><label>Evolución, Síntomas o Nuevos Diagnósticos:</label><textarea id="an-diag" rows="3" placeholder="Describa el motivo de consulta o los hallazgos médicos actuales..." required></textarea></div>
            </div>
            <button type="submit" class="btn-guardar">Registrar Entrada en Historial</button>
        </form>

        <!-- Historial cronológico organizado -->
        <div class="subtitulo-bloque" style="margin-top: 35px;">Historial Clínico Acumulado</div>
        <div id="contenedor-tabla-ant">
            <!-- Se dibuja dinámicamente con JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mascotaActiva = localStorage.getItem('mascota_activa');
            let listaHistoriales = JSON.parse(localStorage.getItem('historiales-antecedentes')) || [];
            
            // Filtrar solo las consultas pertenecientes a esta mascota activa
            let misAntecedentes = listaHistoriales.filter(item => item.mascota.toLowerCase() === mascotaActiva);
            
            const contenedorTabla = document.getElementById('contenedor-tabla-ant');

            // Renderizar la tabla de registros existentes
            function pintarHistorial() {
                if (misAntecedentes.length === 0) {
                    contenedorTabla.innerHTML = `<div class="sin-datos">No hay antecedentes registrados previamente para este paciente.</div>`;
                    return;
                }
                
                let tablaHTML = `
                    <table class="tabla-historial">
                        <thead>
                            <tr>
                                <th style="width: 20%;">Fecha / Hora</th>
                                <th style="width: 15%;">Peso (Kg)</th>
                                <th style="width: 15%;">Temp (°C)</th>
                                <th style="width: 50%;">Diagnóstico / Evolución</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                // Mostrar del más nuevo al más viejo
                misAntecedentes.slice().reverse().forEach(reg => {
                    tablaHTML += `
                        <tr>
                            <td><b>${reg.fecha}</b></td>
                            <td>${reg.peso} Kg</td>
                            <td>${reg.temperatura} °C</td>
                            <td>${reg.diagnostico}</td>
                        </tr>
                    `;
                });
                
                tablaHTML += `</tbody></table>`;
                contenedorTabla.innerHTML = tablaHTML;
            }

            pintarHistorial();

            // Guardar un nuevo control médico
            document.getElementById('form-ant').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const ahora = new Date();
                const fechaFormateada = ahora.toLocaleDateString() + ' - ' + ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const nuevaEntrada = {
                    mascota: mascotaActiva,
                    fecha: fechaFormateada,
                    peso: document.getElementById('an-peso').value,
                    temperatura: document.getElementById('an-temp').value,
                    diagnostico: document.getElementById('an-diag').value
                };

                listaHistoriales.push(nuevaEntrada);
                localStorage.setItem('historiales-antecedentes', JSON.stringify(listaHistoriales));
                
                // Actualizar arrays locales y recargar la vista
                misAntecedentes.push(nuevaEntrada);
                pintarHistorial();
                
                // Limpiar formulario
                document.getElementById('form-ant').reset();
                alert("¡Control médico registrado de manera organizada!");
            });
        });
    </script>
</body>
</html>
