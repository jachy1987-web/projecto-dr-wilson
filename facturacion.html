<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Wilson - Facturación</title>
    <link rel="stylesheet" href="css/facturacion.css">
</head>
<body>
<header>
    <img src="imagenes/logo-doctor-wilson.png" class="logo" alt="Doctor Wilson">
    <h1>Facturación</h1>
</header>

<div class="contenedor principal">
    <form class="formulario" id="formularioFactura">
        <h2>Registrar factura</h2>

        <label for="propietario">Cliente</label>
        <select id="propietario" required>
            <option value="">Seleccione un cliente</option>
        </select>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <div class="separador"></div>
        <h2>Detalle de la factura</h2>

        <div class="detalle-grid">
            <div>
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" placeholder="Ej. Consulta veterinaria">
            </div>
            <div>
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" min="1" value="1">
            </div>
            <div>
                <label for="precio">Precio unitario</label>
                <input type="number" id="precio" min="0" step="0.01" placeholder="0.00">
            </div>
            <button type="button" id="agregarDetalle">Agregar</button>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoDetalles">
                    <tr><td colspan="5" class="vacio">No hay productos o servicios agregados.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="totales">
            <p>Subtotal: <strong id="subtotal">$0.00</strong></p>
            <p>Impuesto (0%): <strong id="impuesto">$0.00</strong></p>
            <p class="total">Total: <strong id="total">$0.00</strong></p>
        </div>

        <label for="estado">Estado</label>
        <select id="estado">
            <option value="pendiente">Pendiente</option>
            <option value="pagada">Pagada</option>
            <option value="anulada">Anulada</option>
        </select>

        <div class="botones">
            <button type="submit">Guardar factura</button>
            <button type="reset">Limpiar</button>
            <button type="button" onclick="window.location.href='principal.html'">Volver</button>
        </div>
    </form>
</div>

<div class="contenedor">
    <h2>Facturas registradas</h2>
    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>N.º</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Subtotal</th>
                    <th>Impuesto</th>
                    <th>Total</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="cuerpoFacturas">
                <tr><td colspan="7" class="vacio">Cargando facturas...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script src="facturacion.js"></script>
</body>
</html>
