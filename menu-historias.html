<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Historias - Dr. Wilson</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("imagenes/fondo doctor wilson.png"); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }

        /*  INTERFAZ ESTILO MÓVIL  */
        .interfaz-movil {
            width: 100%; 
            max-width: 420px; 
            background: rgba(255, 255, 255, 0.94); 
            border-radius: 35px; 
            padding: 25px 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            text-align: center; 
            box-sizing: border-box;
            position: relative;
            margin-top: 10px;
        }

        /* Botón Volver (Círculo azul arriba a la izquierda) */
        .btn-volver-atras {
            position: absolute;
            left: 20px;
            top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-volver-atras .circulo-flecha {
            width: 36px; 
            height: 36px; 
            background-color: #007bff; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .btn-volver-atras:hover .circulo-flecha {
            transform: scale(1.1);
        }
        .btn-volver-atras span {
            margin-top: 3px; 
            font-size: 9px; 
            color: #034870; 
            font-weight: bold; 
            letter-spacing: 0.5px;
        }

        /* Logo de Doctor Wilson centrado superior */
        .logo-cabecera {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 0 auto 5px auto;
        }

        /* Icono de Carpeta Médica Central Verde */
        .icono-carpeta {
            width: 65px;
            height: auto;
            margin: 0 auto 5px auto;
            display: block;
        }

        .seccion-titulo { 
            color: #1e3a8a; 
            font-size: 13px; 
            font-weight: bold; 
            letter-spacing: 0.8px; 
            margin-bottom: 22px; 
            text-transform: uppercase;
        }

        /* 🏷️ INPUTS DE DATOS BÁSICOS (Mascota, ID y Propietario) */
        .info-inputs { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 30px; 
            padding: 0 10px;
        }
        .input-row { 
            display: flex; 
            align-items: center; 
        }
        .input-row label { 
            width: 32%; 
            text-align: right; 
            padding-right: 12px; 
            font-weight: bold; 
            font-size: 14px; 
        }
        
        .lbl-nombre { color: #527a2b; }
        .lbl-identificacion { color: #70a443; }
        .lbl-propietario { color: #61873b; }

        .input-row input { 
            width: 68%; 
            padding: 6px 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 4px; 
            font-size: 14px; 
            background-color: #ffffff; 
            color: #334155; 
            outline: none;
        }

        /*  REJILLA DE LAS 4 TARJETAS CON IMÁGENES */
        .grid-tarjetas { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 35px; 
            padding: 0 10px;
        }
        .tarjeta-medica {
            background: #ffffff; 
            border-radius: 18px; 
            padding: 15px 10px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            border: 1px solid #eef2f5; 
            box-sizing: border-box; 
            height: 125px; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tarjeta-medica:hover { 
            transform: scale(1.02); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .tarjeta-medica img { 
            width: 45px; 
            height: 45px; 
            object-fit: contain; 
        }
        .tarjeta-medica span { 
            font-size: 11px; 
            font-weight: bold; 
            color: #475569; 
            line-height: 1.3; 
        }

        /* 🟩 BOTÓN CERRAR VERDE BASE */
        .btn-cerrar-clinico { 
            width: 50%; 
            padding: 10px; 
            background-color: #557a2b; 
            color: white; 
            font-size: 15px; 
            font-weight: bold; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            display: block; 
            margin: 0 auto; 
        }
        .btn-cerrar-clinico:hover { background-color: #3f5c1f; }
    </style>
</head>
<body>

    <div class="interfaz-movil">
        <!-- Botón Volver (Regresa al buscador historias.html) -->
        <a href="historias.html" class="btn-volver-atras">
            <div class="circulo-flecha">←</div>
            <span>VOLVER</span>
        </a>

        <!-- Logo Principal -->
        <img src="imagenes/drwilson.png" class="logo-cabecera" alt="Doctor Wilson">
        
        <!-- Icono Central de Libreta Médica Verde -->
        <img src="imagenes/historia-icono.png" class="icono-carpeta" alt="Historias">
        <div class="seccion-titulo">HISTORIAS CLINICAS</div>
        
        <!-- Campos Autocompletados (Modo lectura) -->
        <div class="info-inputs">
            <div class="input-row">
                <label class="lbl-nombre">Nombre</label>
                <input type="text" id="txt-clinico-nombre" readonly>
            </div>
            <div class="input-row">
                <label class="lbl-identificacion">Identificación</label>
                <input type="text" id="txt-clinico-id" readonly>
            </div>
            <div class="input-row">
                <label class="lbl-propietario">Propietario</label>
                <input type="text" id="txt-clinico-dueño" readonly>
            </div>
        </div>

        <!-- Las 4 Tarjetas de Opciones -->
        <div class="grid-tarjetas">
            <div class="tarjeta-medica" id="tarjeta-datos">
                <img src="imagenes/mascota-dueño.png" alt="Datos Mascota">
                <span>Datos de mascota<br>y propietario</span>
            </div>
            <div class="tarjeta-medica" id="tarjeta-antecedentes">
                <img src="imagenes/antecedentes.png" alt="Antecedentes">
                <span>Antecedentes<br>medicos</span>
            </div>
            <div class="tarjeta-medica" id="tarjeta-vacunas">
                <img src="imagenes/vacunacion.png" alt="Vacunación">
                <span>Vacunación</span>
            </div>
            <div class="tarjeta-medica" id="tarjeta-tratamientos">
                <img src="imagenes/tratamientos.png" alt="Tratamientos">
                <span>Tratamientos<br>y<br>medicamentos</span>
            </div>
        </div>

        <!-- Botón Cerrar (Regresa también al buscador) -->
        <button class="btn-cerrar-clinico" onclick="window.location.href='historias.html'">Cerrar</button>
    </div>

    <!-- Script exclusivo para leer la mascota activa del buscador -->
    <script src="menu-historias.js"></script>
</body>
</html>
