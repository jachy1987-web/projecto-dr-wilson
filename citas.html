<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas - Dr. Wilson</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("imagenes/fondo doctor wilson.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        /* 🔵 BOTÓN OVALADO AZUL ATRÁS */
        .btn-volver-atras {
            position: absolute; top: 25px; left: 25px;         
            padding: 10px 22px; border-radius: 20px; 
            background-color: #007bff; color: #ffffff;     
            font-size: 15px; font-weight: bold; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); text-decoration: none;
            transition: background-color 0.2s, transform 0.1s; z-index: 10;        
        }
        .btn-volver-atras:hover { background-color: #0056b3; transform: scale(1.05); }

        h2 { color: #0c4a6e; margin-top: 20px; margin-bottom: 30px; font-size: 28px; font-weight: bold; text-align: center; width: 100%; }

        .container-box {
            background: #ffffff; width: 100%; max-width: 850px;
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f5; box-sizing: border-box; margin-bottom: 20px;
        }

        /* Formulario de agendamiento */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .form-group label { color: #2e7d32; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { border-color: #007bff; outline: none; }
        
        .full-width { grid-column: span 2; }

        .botones-contenedor { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .btn-verde { padding: 13px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; color: white; background-color: #1e4620; transition: background 0.2s; }
        .btn-verde:hover { background-color: #143016; }

        /* Tabla de Citas */
        .tabla-citas { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .tabla-citas th, .tabla-citas td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tabla-citas th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        .tabla-citas tr:hover { background-color: #f8fafc; }
        
        .badge-cita { padding: 4px 10px; border-radius: 15px; font-size: 13px; font-weight: bold; background-color: #fef3c7; color: #d97706; }
    </style>
</head>

<body>
    <!-- Enlace nativo que te regresa a la pantalla de inicio -->
    <a href="principal.html" class="btn-volver-atras">Atrás</a>

    <!-- LOGO CORPORATIVO CENTRADO -->
    <div style="text-align: center; margin-top: 20px; margin-bottom: 10px; width: 100%;">
        <img src="imagenes/drwilson.png" alt="Logo Doctor Wilson" style="max-width: 420px !important; width: 100% !important; height: auto !important; display: block; margin: 0 auto;">
    </div>

    <h2>📅 Agendamiento de Citas Médicas</h2>

    <!-- Formulario para Registrar Nueva Cita -->
    <div class="container-box">
        <form id="form-citas">
            <div class="form-grid">
                <!-- Buscador predictivo de pacientes que ya existen en el sistema -->
                <div class="form-group full-width" style="position: relative;">
                    <label for="cita-buscar-paciente">Nombre del Paciente (Mascota)</label>
                    <input type="text" id="cita-buscar-paciente" placeholder="🔍 Escriba el nombre de la mascota registrada..." required>
                    <div id="lista-sugerencias-citas" style="position: absolute; width: 100%; top: 75px; z-index: 20;"></div>
                </div>

                <div class="form-group">
                    <label for="cita-fecha">Fecha de la Cita</label>
                    <input type="date" id="cita-fecha" required>
                </div>

                <div class="form-group">
                    <label for="cita-hora">Hora de la Cita</label>
                    <input type="time" id="cita-hora" required>
                </div>

                <div class="form-group full-width">
                    <label for="cita-motivo">Motivo de la Consulta / Síntomas</label>
                    <input type="text" id="cita-motivo" placeholder="Ej: Control de vacunas, dolor de estómago..." required>
                </div>
            </div>

            <div class="botones-contenedor">
                <button type="submit" class="btn-verde">Agendar Turno</button>
            </div>
        </form>
    </div>

    <!-- Tabla Dinámica para visualizar las citas agendadas -->
    <div class="container-box">
        <h3 style="color: #0c4a6e; text-align: left; margin-top: 0;">📋 Próximas Citas Programadas</h3>
        <table class="tabla-citas">
            <thead>
                <tr>
                    <th>Mascota</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo-citas">
                <!-- Aquí se inyectarán las citas programadas -->
            </tbody>
        </table>
    </div>

    <!-- Vinculación del script de control -->
    <script src="citas.js"></script>
</body>

</html>
