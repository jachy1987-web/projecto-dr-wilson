 <title>Inmunología y Vacunas - Dr. Wilson</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("imagenes/fondo doctor wilson.png");
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .cabecera-estatica { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 750px; margin-bottom: 20px; }
        .btn-volver-atras { position: absolute; left: 5px; top: 10px; display: flex; flex-direction: column; align-items: center; text-decoration: none; cursor: pointer; }
        .btn-volver-atras .circulo-flecha { width: 38px; height: 38px; background-color: #007bff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .btn-volver-atras span { margin-top: 4px; font-size: 10px; color: #034870; font-weight: bold; }
        .logo-cabecera { max-width: 220px; }

        .contenedor-grande {
            width: 100%; max-width: 750px; background: white; border-radius: 25px; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 8px solid #557a2b; text-align: left; box-sizing: border-box;
        }
        .titulo { color: #1e3a8a; font-size: 22px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; text-transform: uppercase; }
        .subtitulo-bloque { color: #557a2b; font-size: 14px; font-weight: bold; margin-top: 10px; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px; text-transform: uppercase; }
        
        .grid-formulario { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input { padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .col-completa { grid-column: span 2; }
        
        .btn-guardar { width: 100%; padding: 14px; background: #557a2b; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-guardar:hover { background: #3f5c1f; }

        .tabla-historial { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fafafa; border-radius: 8px; overflow: hidden; }
        .tabla-historial th { background-color: #1e3a8a; color: white; padding: 12px; font-size: 13px; text-align: left; }
        .tabla-historial td { padding: 12px; font-size: 13px; border-bottom: 1px solid #e2e8f0; color: #334155; }
        .sin-datos { text-align: center; padding: 20px; color: #94a3b8; font-style: italic; background: #f8fafc; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="cabecera-estatica"><a href="menu-historias.html" class="btn-volver-atras"><div class="circulo-flecha">←</div><span>VOLVER</span></a><img src="imagenes/drwilson.png" class="logo-cabecera"></div>
    
    <div class="contenedor-grande">
        <div class="titulo">💉 Registro y Bitácora de Vacunación</div>
        
        <!-- Formulario para agregar una nueva dosis -->
        <form id="form-vac">
            <div class="subtitulo-bloque">Registrar Aplicación de Vacuna</div>
            <div class="grid-formulario">
                <div class="form-group"><label>Nombre de la Vacuna:</label><input type="text" id="vc-nombre" placeholder="Ej: Parvovirus, Triple Felina, Rabia" required></div>
                <div class="form-group"><label>Lote / Fabricante:</label><input type="text" id="vc-lote" placeholder="Ej: Pfizer Vet - Lote 56A" required></div>
                <div class="form-group col-completa"><label>Próximo Refuerzo Recomendado (Fecha sugerida):</label><input type="text" id="vc-refuerzo" placeholder="Ej: Septiembre de 2027" required></div>
            </div>
            <button type="submit" class="btn-guardar">Grabar Vacuna en Carnet Digital</button>
        </form>

        <!-- Historial del carnet digital -->
        <div class="subtitulo-bloque" style="margin-top: 35px;">Carnet de Vacunación Oficial</div>
        <div id="contenedor-tabla-vac">
            <!-- Se dibuja dinámicamente -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mascotaActiva = localStorage.getItem('mascota_activa');
            let listaVacunas = JSON.parse(localStorage.getItem('historiales-vacunas')) || [];
            
            let misVacunas = listaVacunas.filter(item => item.mascota.toLowerCase() === mascotaActiva);
            const contenedorTabla = document.getElementById('contenedor-tabla-vac');

            function pintarCarnet() {
                if (misVacunas.length === 0) {
                    contenedorTabla.innerHTML = `<div class="sin-datos">No se registran inmunizaciones aplicadas en esta clínica.</div>`;
                    return;
                }
                
                let tablaHTML = `
                    <table class="tabla-historial">
                        <thead>
                            <tr>
                                <th style="width: 25%;">Fecha de Aplicación</th>
                                <th style="width: 30%;">Vacuna Biolológica</th>
                                <th style="width: 20%;">Lote</th>
                                <th style="width: 25%;">Próximo Refuerzo</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                misVacunas.slice().reverse().forEach(reg => {
                    tablaHTML += `
                        <tr>
                            <td><b>${reg.fecha}</b></td>
                            <td><span style="color:#2e7d32; font-weight:bold;">💉 ${reg.vacuna}</span></td>
                            <td><code>${reg.lote}</code></td>
                            <td><span style="color:#c62828; font-weight:bold;">📅 ${reg.refuerzo}</span></td>
                        </tr>
                    `;
                });
                
                tablaHTML += `</tbody></table>`;
                contenedorTabla.innerHTML = tablaHTML;
            }

            pintarCarnet();

            document.getElementById('form-vac').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const ahora = new Date();
                const fechaFormateada = ahora.toLocaleDateString();

                const nuevaVacuna = {
                    mascota: mascotaActiva,
                    fecha: fechaFormateada,
                    vacuna: document.getElementById('vc-nombre').value,
                    lote: document.getElementById('vc-lote').value,
                    refuerzo: document.getElementById('vc-refuerzo').value
                };

                listaVacunas.push(nuevaVacuna);
                localStorage.setItem('historiales-vacunas', JSON.stringify(listaVacunas));
                
                misVacunas.push(nuevaVacuna);
                pintarCarnet();
                
                document.getElementById('form-vac').reset();
                alert("¡Carnet de vacunación digital actualizado!");
            });
        });
    </script>
</body>
</html>
